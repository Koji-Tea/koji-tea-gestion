</head><body><div id="login" hidden style="position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px">
 <form id="loginForm" class="card" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px">
  <img id="loginLogo" alt="Koji Tea" style="height:90px;align-self:center">
  <h2 style="text-align:center">Connexion</h2>
  <div class="f"><label for="lgMail">E-mail</label><input id="lgMail" type="email" autocomplete="username" required></div>
  <div class="f"><label for="lgPass">Mot de passe</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
  <p id="lgErr" class="small" style="color:var(--bad);margin:0" hidden></p>
  <button class="btn primary">Se connecter</button>
 </form>
</div>
<script>
"use strict";
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
window.KOJI_DB_PROVIDER=()=>new Promise(resolve=>{
  if(!window.KOJI_FIREBASE_CONFIG){resolve(null);return}
  if(!window.firebase){document.getElementById("login").hidden=false;document.getElementById("loginForm").innerHTML='<h2 style="text-align:center">Connexion impossible</h2><p class="small" style="text-align:center">Vérifiez la connexion internet, puis rechargez la page.</p>';return}
  firebase.initializeApp(window.KOJI_FIREBASE_CONFIG);
  const db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const box=document.getElementById("login");
  document.getElementById("loginLogo").src=(document.querySelector(".top img")||{}).src||"icon-192.png";
  document.getElementById("loginForm").addEventListener("submit",e=>{
    e.preventDefault();e.stopImmediatePropagation();const err=document.getElementById("lgErr");err.hidden=true;
    firebase.auth().signInWithEmailAndPassword(document.getElementById("lgMail").value.trim(),document.getElementById("lgPass").value)
      .catch(()=>{err.textContent="E-mail ou mot de passe incorrect.";err.hidden=false});
  },true);
  let done=false;
  firebase.auth().onAuthStateChanged(u=>{if(u){box.hidden=true;if(!done){done=true;resolve(db)}}else box.hidden=false});
});
</script>

<style>
/* Layout: sidebar on desktop, bottom tab bar on phone; one scrolling work area with cards set off only where they group something. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --matcha:#A3C862; --deep:#BFDD8A; --on-deep:#14200E; --tea:#D7A271; --tea-soft:#2E251B; --sakura:#E7A59A; --sakura-ink:#F0B9AF;
  --good:#8CCB7A; --good-bg:#1E3119; --warn:#E8B85A; --warn-bg:#33280F; --bad:#F08A7E; --bad-bg:#3A1C18; --info:#94BCE0; --info-bg:#18273A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10150D; --surface:#181F14; --surface-2:#212A1B; --ink:#ECF1E3; --muted:#A1AC94; --line:#2E3926;
  --matcha:#A3C862; --deep:#BFDD8A; --on-deep:#14200E; --tea:#D7A271; --tea-soft:#2E251B; --sakura:#E7A59A; --sakura-ink:#F0B9AF;

/* Shell */

/* ---------- Petits outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fCHF=new Intl.NumberFormat("fr-CH",{style:"currency",currency:"CHF"});
const chf=n=>fCHF.format(Math.round((+n||0)*100)/100);
const chf0=n=>"CHF "+new Intl.NumberFormat("fr-CH",{maximumFractionDigits:0}).format(+n||0);
const num=(n,d=0)=>new Intl.NumberFormat("fr-CH",{maximumFractionDigits:d}).format(+n||0);
const pct=n=>isFinite(n)?num(n*100,0)+" %":"–";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const daysTo=s=>Math.round((new Date(s+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);
const fDate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-CH",{day:"numeric",month:"short",year:"numeric"}):"–";
const fDay=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-CH",{weekday:"short",day:"numeric",month:"short"}):"–";
const fMonth=m=>new Date(m+"-15T12:00:00").toLocaleDateString("fr-CH",{month:"long",year:"numeric"});
const fTime=ts=>new Date(ts).toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"});
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const UNITS={g:"g",ml:"ml",pce:"pce"};

const COLS=["products","lots","moves","purchases","menu","events","sales","equipment","expenses"];
let S=Object.fromEntries(COLS.map(c=>[c,new Map()]));
let CFG={vat:true,vatRate:2.6,cardFee:1.5,twintFee:1.3};
let MODE="loading",DB=null,READONLY=false,LOADED=new Set();
const LSKEY="kojitea-data-v1";
const all=c=>[...S[c].values()];
const get=(c,id)=>S[c].get(id);
let VER=0,CACHE={};
const memo=(k,f)=>k in CACHE?CACHE[k]:(CACHE[k]=f());
function changed(){VER++;CACHE={};scheduleRender()}
const chains=new Map();
function enqueue(key,fn){const p=(chains.get(key)||Promise.resolve()).then(fn);chains.set(key,p.catch(()=>{}));return p}
function clean(o){return JSON.parse(JSON.stringify(o))}
function dbErr(e){
  if(e&&e.code==="invalid_argument"){READONLY=true;toast("Modification refusée : ce compte peut seulement consulter les données.","bunny");scheduleRender()}
  else if(e&&e.code==="quota_exceeded")toast("Base de données pleine : exportez une sauvegarde puis supprimez d’anciennes données.","bunny");
  else toast("Enregistrement impossible pour l’instant. Vérifiez la connexion puis réessayez.","bunny");
}
async function cloudWrite(col,id,data){
  return enqueue(col+"/"+id,async()=>{
    const ref=DB.collection(col).doc(id);
    try{data?await ref.set(data):await ref.delete()}
    catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{data?await ref.set(data):await ref.delete()}catch(e2){dbErr(e2)}}else dbErr(e)}
  });
}
function put(col,o){
  o=clean({...o});if(!o.id)o.id=uid();if(!o.createdAt)o.createdAt=new Date().toISOString();o.updatedAt=new Date().toISOString();
  S[col].set(o.id,o);changed();
  if(MODE==="cloud")cloudWrite(col,o.id,o);else saveLocal();
  return o;
}
function del(col,id){S[col].delete(id);changed();if(MODE==="cloud")cloudWrite(col,id,null);else saveLocal()}
function putCfg(p){CFG={...CFG,...p};changed();if(MODE==="cloud")enqueue("config/main",()=>DB.doc("config/main").set(clean(CFG)).catch(dbErr));else saveLocal()}
let saveT;function saveLocal(){clearTimeout(saveT);saveT=setTimeout(()=>{ls(LSKEY,JSON.stringify({cfg:CFG,data:Object.fromEntries(COLS.map(c=>[c,all(c)]))}))},150)}
function loadLocal(){try{const j=JSON.parse(ls(LSKEY)||"null");if(!j)return;CFG={...CFG,...j.cfg};COLS.forEach(c=>{S[c]=new Map((j.data[c]||[]).map(o=>[o.id,o]))})}catch(e){}}

async function initStore(){
  let db=null;
  try{db=window.KOJI_DB_PROVIDER?await window.KOJI_DB_PROVIDER():window.claude&&window.claude.use?await Promise.race([window.claude.use("db"),new Promise(r=>setTimeout(()=>r(null),11000))]):null}catch(e){db=null}
  if(db){
    DB=db;MODE="cloud";
    COLS.forEach(c=>{
      DB.collection(c).onSnapshot(snap=>{S[c]=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));LOADED.add(c);changed()},
        e=>{if(e&&e.code==="revoked"){READONLY=true;scheduleRender()}});
    });
    DB.doc("config/main").onSnapshot(s=>{if(s.exists)CFG={...CFG,...s.data()};LOADED.add("config");changed()},()=>{});
    setTimeout(()=>{COLS.concat("config").forEach(c=>LOADED.add(c));changed()},8000);
  }else{MODE="local";loadLocal();COLS.concat("config").forEach(c=>LOADED.add(c));changed()}
}
const ready=()=>MODE!=="loading"&&LOADED.size>=COLS.length+1;

/* ---------- Calculs ---------- */
function tickets(){return memo("tickets",()=>all("sales").flatMap(b=>(b.tickets||[]).map(t=>({...t,_b:b.id,_demo:!!b.demo}))).sort((a,b)=>a.ts<b.ts?1:-1))}
function stockInfo(){return memo("stock",()=>{
  const res={};
  all("products").forEach(p=>res[p.id]={lots:[],used:0,stock:0});
  tickets().forEach(t=>t.items.forEach(i=>(i.u||[]).forEach(([p,q])=>{if(res[p])res[p].used+=q*i.q})));
  all("lots").forEach(l=>{if(res[l.productId])res[l.productId].lots.push({...l,left:+l.qty||0})});
  const lotOut=[];
  all("moves").forEach(m=>{const r=res[m.productId];if(!r)return;
    if(m.qty>0)r.lots.push({id:m.id,qty:m.qty,left:m.qty,expiry:m.expiry||null,date:m.date,fromMove:true});
    else if(m.lotId)lotOut.push(m);else r.used+=-m.qty});
  Object.values(res).forEach(r=>r.lots.sort((a,b)=>(a.expiry||"9999")<(b.expiry||"9999")?-1:(a.expiry||"9999")>(b.expiry||"9999")?1:(a.date||"")<(b.date||"")?-1:1));
  lotOut.forEach(m=>{const r=res[m.productId];const l=r.lots.find(x=>x.id===m.lotId);let q=-m.qty;if(l){const t=Math.min(l.left,q);l.left-=t;q-=t}r.used+=q});
  Object.values(res).forEach(r=>{let out=r.used;for(const l of r.lots){const t=Math.min(Math.max(l.left,0),out);l.left-=t;out-=t}
    r.stock=sum(r.lots,l=>l.left)-out;r.lots=r.lots.filter(l=>l.left>1e-6)});
  return res})}
const ht=p=>CFG.vat?(+p||0)*100/(100+(+CFG.vatRate||0)):(+p||0);
const MENU_CATS=["Bubble Tea","Bubble Matcha Milk","Matcha Milk","Matcha Tea","Pâtisseries fines","Supplément","Autres"];
const NOT_CUP=["Supplément","Pâtisseries fines"];
const catIdx=c=>{const i=MENU_CATS.indexOf(c||"Autres");return i<0?MENU_CATS.length-1.5:i};
const byMenuCat=(a,b)=>catIdx(a.cat)-catIdx(b.cat)||a.name.localeCompare(b.name);
function productCost(id){const p=get("products",id);return p?+p.cost||0:0}
function recipeCost(recipe){return sum(recipe||[],l=>productCost(l.p)*(+l.q||0))}
function inRange(d,from,to){return (!from||d>=from)&&(!to||d<=to)}
function salesStats(list){
  const rev=sum(list,t=>t.total),cogs=sum(list,t=>t.cost),cups=sum(list,t=>sum(t.items,i=>get("menu",i.m)&&get("menu",i.m).cat&&NOT_CUP.includes(get("menu",i.m).cat)?0:i.q));
  const fee={Carte:CFG.cardFee/100,TWINT:CFG.twintFee/100,"Espèces":0};
  const fees=sum(list,t=>t.total*(fee[t.pay]||0));
  const vat=rev-ht(rev);
  return {rev,vat,net:rev-vat,cogs,cups,n:list.length,fees,gross:rev-vat-cogs,avg:list.length?rev/list.length:0}
}
function eventStats(ev){
  const list=tickets().filter(t=>t.eventId===ev.id);const s=salesStats(list);
  const costs=sum(ev.costs||[],c=>c.a)+sum(all("expenses").filter(x=>x.eventId===ev.id),x=>x.amount);
  return {...s,costs,profit:s.rev-s.vat-s.cogs-s.fees-costs,perHour:ev.hours?s.rev/ev.hours:null,list}
}
function expenseEntries(){return memo("exp",()=>{
  const out=[];
  all("purchases").forEach(p=>out.push({date:p.date,cat:"Achats marchandises",label:(p.supplier||"Achat")+(p.note?" · "+p.note:""),amount:+p.total||0,src:"purchases",id:p.id}));
  all("expenses").forEach(x=>out.push({date:x.date,cat:x.cat||"Autre",label:x.label||x.cat,amount:+x.amount||0,src:"expenses",id:x.id,eventId:x.eventId}));
  all("events").forEach(e=>(e.costs||[]).forEach((c,i)=>out.push({date:e.date,cat:"Frais de manifestation",label:c.l+" · "+e.name,amount:+c.a||0,src:"events",id:e.id})));
  all("equipment").filter(m=>m.compta!==false&&+m.price>0&&m.date).forEach(m=>out.push({date:m.date,cat:"Matériel (investissement)",label:m.name+(m.qty>1?" ×"+m.qty:""),amount:(+m.price||0)*(+m.qty||1),src:"equipment",id:m.id}));
  return out.sort((a,b)=>a.date<b.date?1:-1)})}
function lowStock(){const si=stockInfo();return all("products").filter(p=>+p.min>0&&si[p.id]&&si[p.id].stock<+p.min)}
function expiringLots(maxDays=30){const si=stockInfo();const out=[];all("products").forEach(p=>(si[p.id]?.lots||[]).forEach(l=>{if(l.expiry){const d=daysTo(l.expiry);if(d<=maxDays)out.push({p,l,d})}}));return out.sort((a,b)=>a.d-b.d)}
function expPill(d){if(d<0)return `<span class="pill bad">Périmé depuis ${-d} j</span>`;if(d===0)return `<span class="pill bad">Expire aujourd’hui</span>`;if(d<=7)return `<span class="pill warn">${d} j restants</span>`;if(d<=30)return `<span class="pill info">${d} j restants</span>`;return `<span class="pill neutral">${fDate(addDays(today(),d))}</span>`}
function marginPill(m){if(!isFinite(m))return `<span class="pill neutral">–</span>`;return `<span class="pill ${m>=.7?"good":m>=.55?"warn":"bad"}">${pct(m)}</span>`}

function render(){

function periodRange(p){const t=today();if(p==="mois")return [t.slice(0,8)+"01",t];if(p==="30")return [addDays(t,-29),t];if(p==="annee")return [t.slice(0,4)+"-01-01",t];return ["",""]}
const PERIODS=[["mois","Ce mois"],["30","30 jours"],["annee","Cette année"],["tout","Tout"]];
function barChart(data,fmt){
  if(!data.length)return "";
  const W=640,H=200,pl=44,pb=24,pt=10,max=Math.max(1,...data.map(d=>d.v));
  const step=niceStep(max);const top=Math.ceil(max/step)*step;const bw=(W-pl-8)/data.length;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="gridline" x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`;
  const every=Math.ceil(data.length/10);
  const bars=data.map((d,i)=>{const x=pl+i*bw+bw*.15,w=bw*.7,h=H-pb-y(d.v);return `<rect class="bar" x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(h,d.v>0?2:0)}" rx="${Math.min(4,w/3)}"><title>${esc(d.t)} : ${fmt(d.v)}</title></rect>`+
    (i%every===0?`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(d.s)}</text>`:"")}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires">${g}${bars}</svg></div>`;
}
function niceStep(max){const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r)));for(const m of [1,2,2.5,5,10])if(m*p>=r)return m*p;return 10*p}

function recordSale(pay){
  const cart=UI.cart.filter(c=>get("menu",c.m));if(!cart.length)return;
  const items=cart.map(c=>{const m=get("menu",c.m);return {m:m.id,n:m.name,q:c.q,p:+m.price,c:Math.round(recipeCost(m.recipe)*1000)/1000,u:(m.recipe||[]).filter(l=>l.p&&+l.q).map(l=>[l.p,+l.q])}});
  const ev=ls("kojitea-event")||"";
  const t={id:uid(),ts:new Date().toISOString(),eventId:get("events",ev)?ev:"",items,total:Math.round(sum(items,i=>i.p*i.q)*100)/100,cost:Math.round(sum(items,i=>i.c*i.q)*100)/100,pay};
  const d=today();let n=0,b;
  while(true){const id=d+"_"+DEV+(n?"_"+n:"");b=get("sales",id);if(!b||(b.tickets||[]).length<600){b=b?{...b,tickets:[...b.tickets,t]}:{id,date:d,device:DEV,tickets:[t]};break}n++}
  put("sales",b);UI.cart=[];
  toast(`Vendu ! ${sum(items,i=>i.q)} article${sum(items,i=>i.q)>1?"s":""} · ${chf(t.total)} (${pay})`,"bear");
}

function stockDates(){
  const si=stockInfo();const rows=[];
  all("products").forEach(p=>si[p.id].lots.forEach(l=>rows.push({p,l,d:l.expiry?daysTo(l.expiry):9999})));
  rows.sort((a,b)=>a.d-b.d);

VIEWS.evenements=()=>{
  const evs=all("events");const t=today();

  const past=evs.filter(e=>e.date<t).sort((a,b)=>a.date<b.date?1:-1);

    <div class="end">${s?`<b class="num" style="color:${s.profit<0?"var(--bad)":"var(--good)"}">${chf(s.profit)}</b><div class="tiny muted">${chf(s.rev)} de ventes</div>`:`<span class="pill info">${daysTo(e.date)===0?"Aujourd’hui":"Dans "+daysTo(e.date)+" j"}</span>`}</div></div>`;
  return head("Manifestations","Marchés, fêtes et événements : ce que chacun rapporte vraiment.",`<button class="btn primary" data-act="newEvent">${ic("plus")}Manifestation</button>`)+
  (evs.length?`<div class="stack">
    ${best&&best.s.rev?`<div class="banner" style="margin:0"><img alt="" src="${IMG.bear}"><div class="grow"><b>Meilleure manifestation : ${esc(best.e.name)}</b><div class="small muted">${chf(best.s.profit)} de bénéfice net, ${chf(best.s.rev)} de ventes${best.s.perHour?", soit "+chf(best.s.perHour)+" par heure":""}.</div></div></div>`:""}
    <div class="grid g2">
    <div class="card"><h2>À venir</h2>${up.length?`<div class="list">${up.map(e=>card(e)).join("")}</div>`:`<p class="small muted">Rien de prévu. Ajoutez la prochaine date pour la retrouver dans la caisse.</p>`}</div>
    <div class="card"><h2>Passées</h2>${st.length?`<div class="list">${st.map(({e,s})=>card(e,s)).join("")}</div>`:`<p class="small muted">Les résultats apparaîtront ici après la première manifestation.</p>`}</div>
  </div></div>`:`<div class="card">${emptyBox("chick","Aucune manifestation","Créez un événement, puis choisissez-le dans la caisse : chaque vente lui sera rattachée et vous verrez sa rentabilité.",`<button class="btn primary" data-act="newEvent">Créer une manifestation</button>`)}</div>`);
};
function eventSheet(id){

  const hk=Object.keys(hrs).map(Number).sort((a,b)=>a-b);

  openSheet(`<div class="sheet-head"><div><h2>${esc(e.name)}</h2><div class="small muted">${fDay(e.date)}${e.place?" · "+esc(e.place):""}${e.hours?" · "+num(e.hours,1)+" h":""}</div></div><button class="x" data-act="close" aria-label="Fermer">×</button></div>

  </div>

    <tr><td>Coût des ingrédients et emballages</td><td class="n">− ${chf(s.cogs)}</td></tr>
    ${s.vat?`<tr><td>TVA sur les ventes (${num(CFG.vatRate,1)} %)</td><td class="n">− ${chf(s.vat)}</td></tr>`:""}
    <tr><td>Commissions SumUp et TWINT (estimées)</td><td class="n">− ${chf(s.fees)}</td></tr>

  </tbody></table></div>
  ${s.n?`<div class="row small" style="margin-top:10px;gap:16px"><span>Ticket moyen <b>${chf(s.avg)}</b></span>${s.perHour?`<span>Par heure <b>${chf(s.perHour)}</b></span>`:""}${peak!==undefined?`<span>Heure de pointe <b>${peak} h – ${peak+1} h</b></span>`:""}</div>
  <div class="label" style="margin-top:14px">Boissons vendues</div><div class="row small" style="margin-top:6px">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<span class="pill neutral">${q}× ${esc(n)}</span>`).join("")}</div>`:""}
  ${e.note?`<p class="small muted">${esc(e.note)}</p>`:""}
  <div class="formfoot"><button class="btn" data-act="editEvent" data-id="${e.id}">Modifier</button>${e.date>=addDays(today(),-3)?`<button class="btn primary" data-act="sellAt" data-id="${e.id}">${ic("cash")}Vendre ici</button>`:""}</div>`);

function journal(){
  return memo("journal",()=>{
    const out=expenseEntries().map(e=>({...e,type:"Dépense"}));
    const days={};tickets().forEach(t=>{const d=t.ts.slice(0,10),k=d+"|"+(t.eventId||"");const x=days[k]=days[k]||{date:d,eventId:t.eventId,amount:0,n:0,pay:{}};x.amount+=t.total;x.n++;x.pay[t.pay]=(x.pay[t.pay]||0)+t.total});
    Object.values(days).forEach(x=>{const e=get("events",x.eventId);out.push({type:"Recette",date:x.date,cat:"Ventes boissons",label:(e?e.name:"Ventes hors manifestation")+" · "+x.n+" tickets",amount:x.amount,pay:x.pay})});
    return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.type<b.type?1:-1)});
}
function comptaBilan(){
  const y=UI.year;const cy=new Date().getFullYear();const years=[...new Set([...Array.from({length:Math.max(2030-cy,0)+1},(_,i)=>String(cy+i)),...journal().map(j=>j.date.slice(0,4))])].sort();
  const J=journal().filter(j=>j.date.startsWith(y));
  const months=[];for(let m=1;m<=12;m++){const k=y+"-"+String(m).padStart(2,"0");const r=sum(J.filter(j=>j.type==="Recette"&&j.date.startsWith(k)),j=>j.amount),d=sum(J.filter(j=>j.type==="Dépense"&&j.date.startsWith(k)),j=>j.amount);if(r||d||k<=today().slice(0,7))months.push({k,r,d})}
  const R=sum(J.filter(j=>j.type==="Recette"),j=>j.amount),Dp=sum(J.filter(j=>j.type==="Dépense"),j=>j.amount);
  const cats={};J.filter(j=>j.type==="Dépense").forEach(j=>cats[j.cat]=(cats[j.cat]||0)+j.amount);
  const st=salesStats(tickets().filter(t=>t.ts.startsWith(y)));
  const vat=CFG.vat?R*CFG.vatRate/(100+CFG.vatRate):0;
  return `<div class="row" style="margin-bottom:12px"><label for="yearSel" class="label">Année</label><select id="yearSel" style="width:auto" data-change="year">${years.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></div>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px">
    <div class="kpi"><span class="label">Recettes${CFG.vat?" TTC":""}</span><b>${chf(R)}</b></div>
    <div class="kpi"><span class="label">Dépenses</span><b>${chf(Dp)}</b></div>
    ${CFG.vat?`<div class="kpi"><span class="label">TVA sur les ventes</span><b>${chf(vat)}</b><small>estimation à ${num(CFG.vatRate,1)} %</small></div>`:""}
    <div class="kpi hero"><span class="label">Résultat</span><b>${chf(R-Dp-vat)}</b><small>recettes${CFG.vat?" HT":""} moins dépenses</small></div>
    <div class="kpi"><span class="label">Commissions estimées</span><b>${chf(st.fees)}</b><small>carte ${num(CFG.cardFee,2)} % · TWINT ${num(CFG.twintFee,2)} %</small></div>
  </div>
  <div class="grid g3"><div class="card"><h2>Mois par mois</h2><div class="tbl-wrap"><table><thead><tr><th>Mois</th><th class="n">Recettes${CFG.vat?" TTC":""}</th><th class="n">Dépenses</th><th class="n">Résultat${CFG.vat?" HT":""}</th></tr></thead><tbody>
    ${months.map(m=>`<tr><td style="text-transform:capitalize">${fMonth(m.k)}</td><td class="n">${chf(m.r)}</td><td class="n">${chf(m.d)}</td><td class="n" style="color:${ht(m.r)-m.d<0?"var(--bad)":"var(--good)"};font-weight:700">${chf(ht(m.r)-m.d)}</td></tr>`).join("")}
    <tr class="total"><td>Total ${y}</td><td class="n">${chf(R)}</td><td class="n">${chf(Dp)}</td><td class="n">${chf(R-Dp-vat)}</td></tr></tbody></table></div></div>
  <div class="card"><h2>Dépenses par catégorie</h2>${Object.keys(cats).length?`<div class="list">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="item"><div class="main"><b class="small">${esc(c)}</b><div class="hbar" style="height:6px;margin-top:5px"><span style="width:${v/Dp*100}%;background:var(--tea)"></span></div></div><b class="num small">${chf(v)}</b></div>`).join("")}</div>`:`<p class="small muted">Aucune dépense cette année.</p>`}
   ${CFG.vat?`<p class="tiny muted" style="margin-top:14px">TVA : ${chf(vat)} estimés sur les ventes de ${y} au taux de ${num(CFG.vatRate,1)} %. Selon la méthode choisie avec l’AFC (effective ou taux de la dette fiscale nette), le montant à verser peut être plus bas : à valider avec votre fiduciaire.</p>`:`<p class="tiny muted" style="margin-top:14px">TVA : non assujettie (chiffre d’affaires sous CHF 100 000 par an). Modifiable dans les réglages.</p>`}</div></div>`;
}

let sheetCleanup=null;

function costLines(){return window.__costs.map((c,i)=>`<div class="line l3"><input aria-label="Frais" list="costNames" value="${esc(c.l||"")}" placeholder="ex. Emplacement" data-cline="${i}" data-k="l"><input aria-label="Montant CHF" type="number" step="0.05" min="0" inputmode="decimal" placeholder="CHF" value="${c.a??""}" data-cline="${i}" data-k="a"><button type="button" class="x" data-act="delCLine" data-i="${i}" aria-label="Retirer">×</button></div>`).join("")+`<datalist id="costNames"><option value="Emplacement"><option value="Transport"><option value="Électricité"><option value="Parking"><option value="Aide / personnel"><option value="Glace"></datalist>`}

/* ---------- Actions ---------- */
const N=v=>v===""||v==null?null:+v;
const ACT={
  close:closeSheet,scrim:(el,e)=>{if(e.target===el)closeSheet()},
  period:el=>{UI.period=el.dataset.v;render()},
  stockTab:el=>{UI.stockTab=el.dataset.v;render()},comptaTab:el=>{UI.comptaTab=el.dataset.v;render()},
  goTab:el=>{UI.stockTab=el.dataset.tab},
  addCart:el=>{const c=UI.cart.find(x=>x.m===el.dataset.id);c?c.q++:UI.cart.push({m:el.dataset.id,q:1});render()},
  cartQty:el=>{const c=UI.cart.find(x=>x.m===el.dataset.id);if(!c)return;c.q+=+el.dataset.d;if(c.q<=0)UI.cart=UI.cart.filter(x=>x!==c);render()},
  clearCart:()=>{UI.cart=[];render()},
  pay:el=>{if(el.dataset.pay==="Espèces")cashSheet();else recordSale(el.dataset.pay)},
  cashGiven:el=>{$("#cashIn").value=el.dataset.v;window.__cashUpd&&window.__cashUpd(el.dataset.v)},
  payCash:()=>{closeSheet();recordSale("Espèces")},
  cancelTicket:el=>{const b=get("sales",el.dataset.b);if(!b)return;put("sales",{...b,tickets:b.tickets.filter(t=>t.id!==el.dataset.id)});toast("Vente annulée, le stock est rétabli.","bunny")},
  newProduct:()=>productSheet(),openProduct:el=>productSheet(el.dataset.id),
  delProduct:el=>{del("products",el.dataset.id);all("lots").filter(l=>l.productId===el.dataset.id).forEach(l=>del("lots",l.id));all("moves").filter(l=>l.productId===el.dataset.id).forEach(l=>del("moves",l.id));closeSheet()},
  wasteLot:el=>{const p=get("products",el.dataset.p);const q=+el.dataset.q;put("moves",{productId:p.id,qty:-q,lotId:el.dataset.l,date:today(),reason:"Produit jeté (périmé)",value:q*(+p.cost||0)});toast(`${fQty(q,p.unit)} de ${p.name} retiré du stock.`,"bunny")},
  newPurchase:()=>purchaseSheet(),editPurchase:el=>purchaseSheet(el.dataset.id),
  addPLine:()=>{window.__lines.push({});$("#puLines").innerHTML=purchaseLines()},
  delPLine:el=>{window.__lines.splice(+el.dataset.i,1);if(!window.__lines.length)window.__lines=[{}];$("#puLines").innerHTML=purchaseLines();$("#puTotal").textContent=chf(sum(window.__lines,l=>l.price))},
  delPurchase:el=>{del("purchases",el.dataset.id);all("lots").filter(l=>l.purchaseId===el.dataset.id).forEach(l=>del("lots",l.id));closeSheet()},
  newMenu:()=>menuSheet(),editMenu:el=>menuSheet(el.dataset.id),
  addRLine:()=>{window.__recipe.push({});$("#mLines").innerHTML=recipeLines()},
  delRLine:el=>{window.__recipe.splice(+el.dataset.i,1);$("#mLines").innerHTML=recipeLines();$("#mCalc").innerHTML=recipeCalc($("#mPrice").value)},
  delMenu:el=>{del("menu",el.dataset.id);closeSheet()},
  newEvent:()=>eventFormSheet(),editEvent:el=>eventFormSheet(el.dataset.id),openEvent:el=>eventSheet(el.dataset.id),
  addCLine:()=>{window.__costs.push({});$("#eCosts").innerHTML=costLines()},
  delCLine:el=>{window.__costs.splice(+el.dataset.i,1);$("#eCosts").innerHTML=costLines()},
  delEvent:el=>{del("events",el.dataset.id);closeSheet()},
  sellAt:el=>{ls("kojitea-event",el.dataset.id);closeSheet();location.hash="caisse"},
  newEquip:()=>equipSheet(),editEquip:el=>equipSheet(el.dataset.id),delEquip:el=>{del("equipment",el.dataset.id);closeSheet()},
  newExpense:()=>expenseSheet(),editExpense:el=>expenseSheet(el.dataset.id),delExpense:el=>{del("expenses",el.dataset.id);closeSheet()},
  loadDemo:()=>loadDemo(),clearDemo:()=>clearDemo(),
  wipe:()=>{COLS.forEach(c=>all(c).forEach(o=>del(c,o.id)));toast("Toutes les données ont été supprimées.","bunny")},
  exportJson:()=>saveFile("koji-tea-sauvegarde-"+today()+".json",JSON.stringify({app:"koji-tea",version:1,exported:new Date().toISOString(),cfg:CFG,data:Object.fromEntries(COLS.map(c=>[c,all(c)]))},null,1)),
  exportSales:()=>{const rows=[["Date","Heure","Manifestation","Paiement","Article","Quantité","Prix unitaire","Total ligne","Coût matière"]];
    tickets().slice().reverse().forEach(t=>t.items.forEach(i=>rows.push([t.ts.slice(0,10),fTime(t.ts),(get("events",t.eventId)||{}).name||"",t.pay,i.n,i.q,i.p.toFixed(2),(i.p*i.q).toFixed(2),(i.c*i.q).toFixed(2)])));
    saveFile("koji-tea-ventes-"+today()+".csv",csv(rows))},
  exportJournal:()=>{const rows=[["Date","Type","Catégorie","Libellé","Montant CHF"]];journal().slice().reverse().forEach(j=>rows.push([j.date,j.type,j.cat,j.label,(j.type==="Dépense"?-j.amount:j.amount).toFixed(2)]));saveFile("koji-tea-journal-"+today()+".csv",csv(rows))},
};
const csv=rows=>"﻿"+rows.map(r=>r.map(v=>{v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n");
async function saveFile(filename,data){
  if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast("Fichier enregistré.","bear");return}catch(e){}}
  let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
  if(dl){try{await dl.save({filename,data});toast("Fichier enregistré.","bear");return}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Un autre téléchargement est en cours, réessayez dans un instant.","bunny");return}}}
  openSheet(`<div class="sheet-head"><h2>${esc(filename)}</h2><button class="x" data-act="close" aria-label="Fermer">×</button></div><p class="small muted">Le téléchargement direct n’est pas disponible ici. Copiez le contenu et collez-le dans un fichier.</p><textarea id="dlText" readonly style="min-height:240px;font-family:ui-monospace,monospace;font-size:.78rem">${esc(data)}</textarea><div class="formfoot"><span></span><button class="btn primary" data-act="copyDl">Copier</button></div>`);
}
ACT.logout=()=>{firebase.auth().signOut().then(()=>location.reload())};
ACT.copyDl=()=>{const t=$("#dlText");navigator.clipboard?.writeText(t.value).then(()=>toast("Copié.","bear"),()=>{t.select()})};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;if(!ACT[a])return;
  if(a==="scrim"){if(e.target===el)closeSheet();return}
  if(el.dataset.confirm&&!el.classList.contains("armed")){e.preventDefault();e.stopPropagation();const old=el.innerHTML;el.classList.add("armed");el.textContent=el.dataset.confirm;setTimeout(()=>{if(el.isConnected){el.classList.remove("armed");el.innerHTML=old}},3500);return}
  if(el.tagName!=="A")e.preventDefault();
  if(READONLY&&!["close","scrim","period","stockTab","comptaTab","goTab","openEvent","openProduct","exportJson","exportSales","exportJournal","copyDl","addCart","cartQty","clearCart"].includes(a)&&/^(new|edit|del|pay|cancel|waste|load|clear|wipe)/.test(a)){toast("Ce compte peut seulement consulter les données.","bunny");return}
  ACT[a](el,e);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.input==="search"){UI.q=t.value;render()}
  if(t.dataset.input==="cashIn"&&window.__cashUpd)window.__cashUpd(t.value);
  if(t.dataset.line!==undefined){window.__lines[+t.dataset.line][t.dataset.k]=t.dataset.k==="price"||t.dataset.k==="qty"?N(t.value):t.value;$("#puTotal").textContent=chf(sum(window.__lines,l=>l.price))}
  if(t.dataset.rline!==undefined){window.__recipe[+t.dataset.rline][t.dataset.k]=t.dataset.k==="q"?N(t.value):t.value;$("#mCalc").innerHTML=recipeCalc($("#mPrice").value)}
  if(t.dataset.cline!==undefined){window.__costs[+t.dataset.cline][t.dataset.k]=t.dataset.k==="a"?N(t.value):t.value}
  if(t.dataset.input==="recalc")$("#mCalc").innerHTML=recipeCalc(t.value);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.line!==undefined&&t.dataset.k==="p"){window.__lines[+t.dataset.line].p=t.value;$("#puLines").innerHTML=purchaseLines()}
  if(t.dataset.rline!==undefined&&t.dataset.k==="p"){window.__recipe[+t.dataset.rline].p=t.value;$("#mLines").innerHTML=recipeLines();$("#mCalc").innerHTML=recipeCalc($("#mPrice").value)}
  const c=t.dataset.change;
  if(c==="posEvent"){ls("kojitea-event",t.value);render()}
  if(c==="year"){UI.year=t.value;render()}
  if(c==="jmonth"){UI.journalMonth=t.value;render()}
  if(c==="import"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=="koji-tea"||!j.data)throw 0;COLS.forEach(col=>(j.data[col]||[]).forEach(o=>put(col,o)));if(j.cfg)putCfg(j.cfg);toast("Sauvegarde restaurée.","bear")}catch(err){toast("Ce fichier n’est pas une sauvegarde Koji Tea.","bunny")}};r.readAsText(t.files[0])}
});
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();if(READONLY){toast("Ce compte peut seulement consulter les données.","bunny");return}
  const d=Object.fromEntries(new FormData(f));const id=f.dataset.id||undefined;const kind=f.dataset.submit;
  if(kind==="product"){
    const o={...(id?get("products",id):{}),id,name:d.name.trim(),cat:d.cat,unit:d.unit,cost:N(d.cost)||0,min:N(d.min)||0,demo:false};
    const saved=put("products",o);
    if(!id&&N(d.init))put("moves",{productId:saved.id,qty:N(d.init),expiry:d.expiry||null,date:today(),reason:"Stock initial"});
    closeSheet();toast(id?"Produit mis à jour.":"Produit ajouté au stock.","bear");
  }
  if(kind==="adjust"){
    const p=get("products",id);const cur=stockInfo()[id].stock;const diff=N(d.qty)-cur;
    if(Math.abs(diff)>1e-9){put("moves",{productId:id,qty:diff,date:today(),reason:d.why,value:diff*(+p.cost||0)});toast(`Stock corrigé : ${diff>0?"+":""}${fQty(diff,p.unit)}.`,"bear")}
    closeSheet();
  }
  if(kind==="inventory"){
    const si=stockInfo();let n=0;
    Object.entries(d).forEach(([pid,v])=>{if(v==="")return;const p=get("products",pid);if(!p)return;const diff=+v-si[pid].stock;if(Math.abs(diff)>1e-9){put("moves",{productId:pid,qty:diff,date:today(),reason:"Inventaire",value:diff*(+p.cost||0)});n++}});
    toast(n?`Inventaire validé : ${n} correction${n>1?"s":""}.`:"Inventaire validé, aucun écart.","bear");f.reset();
  }
  if(kind==="purchase"){
    const lines=window.__lines.filter(l=>l.p&&N(l.qty)>0).map(l=>({p:l.p,qty:+l.qty,price:+l.price||0,expiry:l.expiry||null}));
    if(!lines.length){toast("Ajoutez au moins un produit avec sa quantité.","bunny");return}
    const old=id?get("purchases",id):null;
    if(old)all("lots").filter(l=>l.purchaseId===id).forEach(l=>del("lots",l.id));
    const si=stockInfo();
    lines.forEach(l=>{const p=get("products",l.p);if(!p)return;const st=Math.max(si[p.id].stock,0);const nc=l.price>0?((st*(+p.cost||0))+l.price)/(st+l.qty):+p.cost||0;if(l.price>0)put("products",{...p,cost:Math.round(nc*1e5)/1e5,demo:false})});
    const pu=put("purchases",{...(old||{}),id,date:d.date,supplier:d.supplier.trim(),note:d.note,lines,total:Math.round(sum(lines,l=>l.price)*100)/100,demo:false});
    lines.forEach((l,i)=>put("lots",{id:pu.id+"-"+i,purchaseId:pu.id,productId:l.p,qty:l.qty,expiry:l.expiry,date:d.date}));
    closeSheet();toast(`Achat enregistré : ${chf(pu.total)}. Stock mis à jour.`,"bear");
  }
  if(kind==="menu"){
    const recipe=window.__recipe.filter(l=>l.p&&N(l.q)>0).map(l=>({p:l.p,q:+l.q}));
    put("menu",{...(id?get("menu",id):{}),id,name:d.name.trim(),cat:d.cat||"Autres",price:N(d.price)||0,color:d.color||"#C9945F",recipe,active:!!d.active,demo:false});
    closeSheet();toast("Carte mise à jour.","bear");
  }
  if(kind==="event"){
    const costs=window.__costs.filter(c=>(c.l||"").trim()&&N(c.a)>0).map(c=>({l:c.l.trim(),a:+c.a}));
    const ev=put("events",{...(id?get("events",id):{}),id,name:d.name.trim(),date:d.date,hours:N(d.hours),place:d.place.trim(),note:d.note,costs,demo:false});
    closeSheet();toast("Manifestation enregistrée.","bear");if(!id&&ev.date===today())ls("kojitea-event",ev.id);
  }
  if(kind==="equip"){put("equipment",{...(id?get("equipment",id):{}),id,name:d.name.trim(),cat:d.cat.trim()||"Autre",qty:N(d.qty)||1,price:N(d.price),date:d.date,state:d.state,place:d.place.trim(),note:d.note,compta:!!d.compta,demo:false});closeSheet();toast("Matériel enregistré.","bear")}
  if(kind==="expense"){put("expenses",{...(id?get("expenses",id):{}),id,label:d.label.trim(),amount:N(d.amount)||0,date:d.date,cat:d.cat,eventId:d.eventId,demo:false});closeSheet();toast("Dépense enregistrée.","bear")}
  if(kind==="settings"){putCfg({vat:!!d.vat,vatRate:N(d.vatRate)??2.6,cardFee:N(d.cardFee)??0,twintFee:N(d.twintFee)??0});toast("Réglages enregistrés.","bear")}
});
let toastT;function toast(msg,img="bear"){clearTimeout(toastT);$("#toastRoot").innerHTML=`<div class="toast" role="status"><img alt="" src="${IMG[img]}">${esc(msg)}</div>`;toastT=setTimeout(()=>{$("#toastRoot").innerHTML=""},3200)}

nav();
initStore();
</script>
